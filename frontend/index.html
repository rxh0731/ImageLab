<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ImageLab · 古文图像净化</title>
  <style>
    :root { color-scheme:light; --ink:#29271f; --muted:#716d61; --paper:#f6f4ed; --panel:#fffefa; --line:#dedbd1; --accent:#a44a32; --soft:#f2e5df; --green:#3e7662; }
    * { box-sizing:border-box; } body { margin:0; background:var(--paper); color:var(--ink); font:14px/1.5 "Segoe UI","Microsoft YaHei",sans-serif; }
    button,input,select { font:inherit; } button { cursor:pointer; }
    .topbar { display:flex; align-items:center; min-height:58px; gap:22px; padding:0 28px; background:var(--panel); border-bottom:1px solid var(--line); }
    .brand { display:flex; align-items:center; gap:10px; font-weight:600; font-size:16px; } .mark { display:grid; place-items:center; width:29px; height:29px; border-radius:6px; background:var(--accent); color:#fff; }
    .steps { display:flex; gap:5px; color:var(--muted); font-size:12px; } .step { padding:7px 11px; border-radius:5px; } .step.active { color:var(--accent); background:var(--soft); font-weight:600; }
    .top-actions { margin-left:auto; display:flex; gap:8px; } .btn { min-height:35px; padding:0 13px; border:1px solid var(--line); border-radius:6px; background:var(--panel); color:var(--ink); } .btn.primary { color:#fff; background:var(--accent); border-color:var(--accent); }
    .layout { display:grid; grid-template-columns:214px minmax(0,1fr) 280px; min-height:calc(100vh - 58px); }
    aside { padding:20px 15px; background:#f0eee6; border-right:1px solid var(--line); } aside.right { border-right:0; border-left:1px solid var(--line); background:var(--panel); }
    .eyebrow { margin:0 8px 10px; color:var(--muted); font-size:11px; letter-spacing:.08em; text-transform:uppercase; } .file { display:flex; gap:9px; padding:10px; border:1px solid var(--line); border-radius:6px; background:var(--panel); } .file-icon { display:grid; place-items:center; width:30px; height:36px; background:#e7dccb; color:var(--accent); }
    .file strong { display:block; width:125px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:12px; } .file small { color:var(--muted); font-size:11px; }
    .nav { margin-top:18px; display:grid; gap:3px; } .nav button { display:flex; width:100%; padding:10px 9px; border:0; border-radius:5px; background:transparent; text-align:left; color:var(--muted); } .nav button.active { background:var(--soft); color:var(--accent); font-weight:600; } .nav button span { margin-left:auto; }
    main { min-width:0; padding:20px 24px; } h1 { margin:0 0 4px; font-size:20px; font-weight:600; } .sub { margin:0 0 17px; color:var(--muted); font-size:12px; }
    .drop { display:grid; place-items:center; min-height:370px; border:1px dashed #c9c3b4; border-radius:7px; background:#eee9de; text-align:center; } .drop.has-image { min-height:0; padding:0; border-style:solid; } .drop img { display:block; max-width:100%; max-height:500px; margin:auto; }
    .drop strong { display:block; margin-top:9px; font-size:14px; } .drop span { color:var(--muted); font-size:12px; } .drop input { display:none; }
    .meta { display:flex; justify-content:space-between; margin-top:8px; color:var(--muted); font-size:11px; } .good { color:var(--green); }
    .fields h2 { margin:0 0 17px; font-size:14px; } .field { margin-bottom:16px; } label { display:flex; justify-content:space-between; margin-bottom:6px; color:var(--muted); font-size:11px; } select { width:100%; height:34px; border:1px solid var(--line); border-radius:5px; padding:0 8px; background:var(--panel); color:var(--ink); } input[type=range] { width:100%; accent-color:var(--accent); } .check { justify-content:flex-start; gap:8px; margin:10px 0; color:var(--ink); font-size:12px; } .fields .btn { width:100%; margin-top:7px; }
    .outputs { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:15px; } .output { padding:11px 12px; border:1px solid var(--line); border-radius:6px; background:var(--panel); } .output small { display:block; margin-bottom:4px; color:var(--muted); font-size:11px; } .output strong { font-size:13px; font-weight:500; }
    .status { margin-top:18px; padding:10px 12px; background:#fbf3e7; border-left:3px solid #c38b58; color:#6e523f; font-size:11px; }
    @media(max-width:900px){ .layout{grid-template-columns:180px minmax(0,1fr)} aside.right{grid-column:1/-1;border-left:0;border-top:1px solid var(--line)} }
    @media(max-width:640px){ .topbar{padding:12px;flex-wrap:wrap}.steps{order:3;width:100%;overflow:auto}.layout{display:block} aside{border-right:0;border-bottom:1px solid var(--line)} main{padding:15px 12px}.outputs{grid-template-columns:1fr} }
  </style>
</head>
<body>
  <header class="topbar"><div class="brand"><span class="mark">拓</span>碑文净化工作台</div><div class="steps"><span class="step active">1 导入</span><span class="step">2 处理</span><span class="step">3 复核</span><span class="step">4 导出</span></div><div class="top-actions"><label class="btn" for="file">＋ 导入图片</label><button class="btn primary" id="export" type="button">导出结果</button></div></header>
  <div class="layout">
    <aside><p class="eyebrow">当前资料</p><div class="file"><div class="file-icon">文</div><div><strong id="file-name">尚未导入图片</strong><small id="file-meta">支持 JPG、PNG、TIFF、WEBP、BMP</small></div></div><p class="eyebrow" style="margin-top:22px">工作步骤</p><div class="nav"><button class="active" type="button">◉ 图像处理 <span>进行中</span></button><button type="button">◇ 问题复核 <span id="review-count">--</span></button><button type="button">□ 导出版本</button></div></aside>
    <main><h1>处理预览</h1><p class="sub">先导入一张图片，系统会保留原图并生成可回溯的处理版本。</p><label class="drop" id="drop" for="file"><div><div style="font-size:28px;color:var(--accent)">↑</div><strong>拖入图片，或点击选择文件</strong><span>建议使用原始扫描图或无损照片</span></div><input id="file" type="file" accept="image/jpeg,image/png,image/tiff,image/webp,image/bmp"></label><div class="meta"><span id="result-label">等待导入</span><span class="good" id="confidence"></span></div><div class="outputs"><div class="output"><small>增强灰度图</small><strong id="enhanced-link">未生成</strong></div><div class="output"><small>文字候选图</small><strong id="mask-link">未生成</strong></div><div class="output"><small>透明背景 PNG</small><strong id="transparent-link">未生成</strong></div></div><div class="status" id="status" role="status" aria-live="polite">建议先选择资料类型，再开始处理。系统默认采用“保守保真”策略。</div></main>
    <aside class="right"><div class="fields"><h2>处理参数</h2><div class="field"><label for="type">资料类型</label><select id="type"><option value="rubbing">古代碑文拓印</option><option value="book">古籍扫描</option><option value="manuscript">古代手稿扫描</option><option value="other">其他文献图像</option></select></div><div class="field"><label for="mode">处理模式</label><select id="mode"><option value="conservative">保守保真（推荐）</option><option value="balanced">平衡增强</option><option value="strong">强力去杂</option></select></div><div class="field"><label for="keep-faint">淡笔画保留</label><select id="keep-faint"><option value="true">开启</option><option value="false">关闭</option></select></div><button class="btn primary" id="process" type="button">开始处理</button></div></aside>
  </div>
  <script>
    const fileInput=document.getElementById('file'); const drop=document.getElementById('drop'); const status=document.getElementById('status'); let result=null;
    const setStatus=(text)=>{status.textContent=text;};
    fileInput.addEventListener('change',()=>{const f=fileInput.files[0]; if(!f)return; document.getElementById('file-name').textContent=f.name; document.getElementById('file-meta').textContent=(f.size/1024/1024).toFixed(1)+' MB'; drop.classList.add('has-image'); const img=document.createElement('img'); img.alt='待处理原图预览'; img.src=URL.createObjectURL(f); drop.replaceChildren(img); setStatus('图片已导入。请选择右侧参数后开始处理。');});
    document.getElementById('process').addEventListener('click',async()=>{const f=fileInput.files[0]; if(!f){setStatus('请先导入图片。');return;} setStatus('正在进行背景校正、保边去噪和文字候选提取…'); const body=new FormData(); body.append('file',f); body.append('image_type',document.getElementById('type').value); body.append('mode',document.getElementById('mode').value); body.append('keep_faint',document.getElementById('keep-faint').value); try{const res=await fetch('/api/process',{method:'POST',body}); if(!res.ok)throw new Error((await res.json()).detail||'处理失败'); result=await res.json(); const base=result.output_base; document.getElementById('enhanced-link').innerHTML='<a href="'+base+result.enhanced+'" target="_blank">查看 PNG</a>'; document.getElementById('mask-link').innerHTML='<a href="'+base+result.text_mask+'" target="_blank">查看 PNG</a>'; document.getElementById('transparent-link').innerHTML='<a href="'+base+result.transparent+'" target="_blank">查看 PNG</a>'; document.getElementById('result-label').textContent='已生成处理版本'; document.getElementById('confidence').textContent='文字保留置信度 '+result.confidence+'%'; document.getElementById('review-count').textContent='待接入'; setStatus('处理完成。请先查看灰度图，再进入问题复核。');}catch(e){setStatus(e.message);}});
    document.getElementById('export').addEventListener('click',()=>{setStatus(result?'结果文件已生成，可从下方分别打开。':'请先完成一次图片处理。');});
  </script>
</body>
</html>
