<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ImageLab · 古文图像净化</title>
  <style>
    :root{color-scheme:light;--ink:#29271f;--muted:#716d61;--paper:#f6f4ed;--panel:#fffefa;--line:#dedbd1;--accent:#a44a32;--soft:#f2e5df;--green:#3e7662;--warn:#b8793e}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.5 "Segoe UI","Microsoft YaHei",sans-serif}button,input,select{font:inherit}button{cursor:pointer}.topbar{display:flex;align-items:center;min-height:58px;gap:22px;padding:0 28px;background:var(--panel);border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:16px}.mark{display:grid;place-items:center;width:29px;height:29px;border-radius:6px;background:var(--accent);color:#fff}.steps{display:flex;gap:5px;color:var(--muted);font-size:12px}.step{padding:7px 11px;border-radius:5px}.step.active{color:var(--accent);background:var(--soft);font-weight:600}.top-actions{margin-left:auto;display:flex;gap:8px}.btn{min-height:35px;padding:0 13px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink)}.btn.primary{color:#fff;background:var(--accent);border-color:var(--accent)}.layout{display:grid;grid-template-columns:214px minmax(0,1fr) 280px;min-height:calc(100vh - 58px)}aside{padding:20px 15px;background:#f0eee6;border-right:1px solid var(--line)}aside.right{border-right:0;border-left:1px solid var(--line);background:var(--panel)}.eyebrow{margin:0 8px 10px;color:var(--muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase}.file{display:flex;gap:9px;padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--panel)}.file-icon{display:grid;place-items:center;width:30px;height:36px;background:#e7dccb;color:var(--accent)}.file strong{display:block;width:125px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}.file small{color:var(--muted);font-size:11px}.nav{margin-top:18px;display:grid;gap:3px}.nav button{display:flex;width:100%;padding:10px 9px;border:0;border-radius:5px;background:transparent;text-align:left;color:var(--muted)}.nav button.active{background:var(--soft);color:var(--accent);font-weight:600}.nav button span{margin-left:auto}main{min-width:0;padding:20px 24px}h1{margin:0 0 4px;font-size:20px;font-weight:600}.sub{margin:0 0 17px;color:var(--muted);font-size:12px}.compare{position:relative;display:grid;place-items:center;min-height:390px;overflow:hidden;border:1px solid #c9c3b4;border-radius:7px;background:#e9e4d8}.compare.empty{border-style:dashed}.compare img{display:block;max-width:100%;max-height:510px;object-fit:contain}.compare .original{position:absolute;inset:0;display:grid;place-items:center}.compare .cleaned{position:absolute;inset:0;display:grid;place-items:center;overflow:hidden;clip-path:inset(0 42% 0 0)}.compare .cleaned img,.compare .original img{width:100%;height:100%;object-fit:contain}.compare .cleaned img{filter:contrast(1.08)}.compare-label{position:absolute;top:12px;z-index:3;padding:4px 7px;color:#fff;background:rgba(38,35,28,.7);border-radius:4px;font-size:10px}.compare-label.left{left:12px}.compare-label.right{right:12px}.split{position:absolute;left:58%;top:0;bottom:0;z-index:4;width:28px;transform:translateX(-50%);display:flex;align-items:center;justify-content:center;cursor:ew-resize}.split:before{content:"";height:100%;width:2px;background:var(--accent)}.split:after{content:"↔";position:absolute;display:grid;place-items:center;width:25px;height:25px;border:2px solid #fff;border-radius:50%;background:var(--accent);color:#fff;font-size:12px}.split-range{position:absolute;inset:0;width:100%;opacity:0;z-index:5;cursor:ew-resize}.empty-content{text-align:center}.empty-content .upload-symbol{font-size:29px;color:var(--accent)}.empty-content strong{display:block;margin-top:9px;font-size:14px}.empty-content span{color:var(--muted);font-size:12px}.meta{display:flex;justify-content:space-between;margin-top:8px;color:var(--muted);font-size:11px}.good{color:var(--green)}.outputs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:15px}.output{padding:11px 12px;border:1px solid var(--line);border-radius:6px;background:var(--panel)}.output small{display:block;margin-bottom:4px;color:var(--muted);font-size:11px}.output strong{font-size:13px;font-weight:500}.output a{color:var(--accent);font-size:12px}.review{margin-top:17px;padding-top:14px;border-top:1px solid var(--line)}.review-head{display:flex;justify-content:space-between;align-items:center}.review h2,.fields h2{margin:0;font-size:14px}.review-head span{color:var(--muted);font-size:11px}.region-list{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.region-chip{padding:6px 9px;border:1px solid var(--line);border-radius:5px;background:var(--panel);color:var(--muted);font-size:11px}.region-chip.low{border-color:#dfb17e;color:#9b5e2c;background:#fff7ed}.region-chip.selected{border-color:var(--accent);color:var(--accent);background:var(--soft)}.fields h2{margin-bottom:17px}.field{margin-bottom:16px}.field label{display:flex;justify-content:space-between;margin-bottom:6px;color:var(--muted);font-size:11px}.field select{width:100%;height:34px;border:1px solid var(--line);border-radius:5px;padding:0 8px;background:var(--panel);color:var(--ink)}.check{display:flex;gap:8px;align-items:center;margin:10px 0;color:var(--ink);font-size:12px}.check input{accent-color:var(--accent)}.fields .btn{width:100%;margin-top:7px}.status{margin-top:18px;padding:10px 12px;background:#fbf3e7;border-left:3px solid #c38b58;color:#6e523f;font-size:11px}.hidden{display:none!important}@media(max-width:900px){.layout{grid-template-columns:180px minmax(0,1fr)}aside.right{grid-column:1/-1;border-left:0;border-top:1px solid var(--line)}}@media(max-width:640px){.topbar{padding:12px;flex-wrap:wrap}.steps{order:3;width:100%;overflow:auto}.layout{display:block}aside{border-right:0;border-bottom:1px solid var(--line)}main{padding:15px 12px}.outputs{grid-template-columns:1fr}.compare{min-height:320px}}
  </style>
</head>
<body>
  <header class="topbar"><div class="brand"><span class="mark">拓</span>碑文净化工作台</div><div class="steps"><span class="step active" data-step="import">1 导入</span><span class="step" data-step="process">2 处理</span><span class="step" data-step="review">3 复核</span><span class="step" data-step="export">4 导出</span></div><div class="top-actions"><label class="btn" for="file">＋ 导入图片</label><button class="btn primary" id="export" type="button">导出结果</button></div></header>
  <div class="layout">
    <aside><p class="eyebrow">当前资料</p><div class="file"><div class="file-icon">文</div><div><strong id="file-name">尚未导入图片</strong><small id="file-meta">支持 JPG、PNG、TIFF、WEBP、BMP</small></div></div><p class="eyebrow" style="margin-top:22px">工作步骤</p><div class="nav"><button class="active" data-nav="process" type="button">◉ 图像处理 <span>进行中</span></button><button data-nav="review" type="button">◇ 问题复核 <span id="review-count">--</span></button><button data-nav="export" type="button">□ 导出版本</button></div></aside>
    <main><h1>处理预览</h1><p class="sub">拖动中间分隔线，对比原图与净化结果。文字区域仅用于复核，不会硬切原始笔画。</p><section class="compare empty" id="compare" aria-label="原图与处理结果对照"><div class="empty-content" id="empty"><div class="upload-symbol">↑</div><strong>拖入图片，或点击“导入图片”</strong><span>系统会保留原图并生成可回溯的处理版本</span></div><div class="original hidden" id="original-wrap"><img id="original-img" alt="原图"></div><div class="cleaned hidden" id="cleaned-wrap"><img id="cleaned-img" alt="净化结果"></div><span class="compare-label left hidden" id="label-original">原图</span><span class="compare-label right hidden" id="label-cleaned">净化结果</span><div class="split hidden" id="split"></div><input class="split-range hidden" id="split-range" type="range" min="10" max="90" value="58" aria-label="对照分隔线位置"><svg class="hidden" id="regions" aria-label="文字候选区域"></svg><input id="file" class="hidden" type="file" accept="image/jpeg,image/png,image/tiff,image/webp,image/bmp"></section><div class="meta"><span id="result-label">等待导入</span><span class="good" id="confidence"></span></div><div class="outputs"><div class="output"><small>增强灰度图</small><strong id="enhanced-link">未生成</strong></div><div class="output"><small>文字候选图</small><strong id="mask-link">未生成</strong></div><div class="output"><small>透明背景 PNG</small><strong id="transparent-link">未生成</strong></div></div><section class="review"><div class="review-head"><h2>文字区域复核</h2><span id="review-note">处理后生成候选区域</span></div><div class="region-list" id="region-list"><span class="region-chip">暂无区域</span></div></section><div class="status" id="status" role="status" aria-live="polite">建议先选择资料类型，再开始处理。默认采用“保守保真”策略。</div></main>
    <aside class="right"><div class="fields"><h2>处理参数</h2><div class="field"><label for="type">资料类型</label><select id="type"><option value="rubbing">古代碑文拓印</option><option value="book">古籍扫描</option><option value="manuscript">古代手稿扫描</option><option value="other">其他文献图像</option></select></div><div class="field"><label for="mode">处理模式</label><select id="mode"><option value="conservative">保守保真（推荐）</option><option value="balanced">平衡增强</option><option value="strong">强力去杂</option></select></div><label class="check"><input id="keep-faint" type="checkbox" checked>保留淡色笔画</label><label class="check"><input id="crack" type="checkbox" checked>识别裂纹和污渍</label><label class="check"><input id="ocr" type="checkbox">OCR 辅助复核</label><button class="btn primary" id="process" type="button">开始处理</button></div></aside>
  </div>
  <script>
    const $=id=>document.getElementById(id);let selectedFile=null,result=null;
    const setStatus=t=>{$('status').textContent=t};const setStep=name=>document.querySelectorAll('[data-step]').forEach(el=>el.classList.toggle('active',el.dataset.step===name));
    function showFile(file){selectedFile=file;$('file-name').textContent=file.name;$('file-meta').textContent=(file.size/1024/1024).toFixed(1)+' MB';$('empty').classList.add('hidden');$('compare').classList.remove('empty');$('original-wrap').classList.remove('hidden');$('label-original').classList.remove('hidden');$('original-img').src=URL.createObjectURL(file);$('result-label').textContent='图片已导入';setStatus('图片已导入。请选择右侧参数后开始处理。');setStep('process')}
    $('file').addEventListener('change',()=>{if($('file').files[0])showFile($('file').files[0])});$('compare').addEventListener('dragover',e=>e.preventDefault());$('compare').addEventListener('drop',e=>{e.preventDefault();const f=e.dataTransfer.files[0];if(f)showFile(f)});
    function renderRegions(regions,w,h){const svg=$('regions');svg.innerHTML='';svg.setAttribute('viewBox',`0 0 ${w} ${h}`);svg.style.cssText='position:absolute;inset:0;width:100%;height:100%;pointer-events:none';svg.classList.remove('hidden');regions.slice(0,60).forEach(r=>{const p=document.createElementNS('http://www.w3.org/2000/svg','polygon');p.setAttribute('points',r.polygon.map(x=>x.join(',')).join(' '));p.dataset.id=r.id;p.style.fill='rgba(164,74,50,.08)';p.style.stroke=r.confidence<70?'#b8793e':'#a44a32';p.style.strokeWidth='3';p.style.vectorEffect='non-scaling-stroke';svg.appendChild(p)});const list=$('region-list');list.innerHTML='';if(!regions.length){list.innerHTML='<span class="region-chip">未检测到稳定区域，请调低阈值或切换模式</span>';return}regions.slice(0,20).forEach(r=>{const b=document.createElement('button');b.type='button';b.className='region-chip'+(r.confidence<70?' low':'');b.textContent='区域 '+r.id+' · '+r.confidence+'%';b.addEventListener('click',()=>{document.querySelectorAll('.region-chip').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');svg.querySelectorAll('polygon').forEach(p=>p.style.strokeWidth=p.dataset.id==r.id?'7':'3');setStatus('已选中区域 '+r.id+'，请对照原图确认是否保留。');setStep('review')});list.appendChild(b)});$('review-count').textContent=regions.filter(r=>r.confidence<70).length+' 处';$('review-note').textContent=regions.length+' 个候选区域，低置信度区域优先复核'}
    function setSplit(v){const n=Number(v);$('cleaned-wrap').style.clipPath=`inset(0 ${100-n}% 0 0)`;$('split').style.left=n+'%'}$('split-range').addEventListener('input',e=>setSplit(e.target.value));
    $('process').addEventListener('click',async()=>{if(!selectedFile){setStatus('请先导入图片。');return}setStatus('正在进行背景校正、保边去噪和文字区域分析…');setStep('process');const body=new FormData();body.append('file',selectedFile);body.append('image_type',$('type').value);body.append('mode',$('mode').value);body.append('keep_faint',$('keep-faint').checked?'true':'false');try{const res=await fetch('/api/process',{method:'POST',body});if(!res.ok)throw new Error((await res.json()).detail||'处理失败');result=await res.json();const base=result.output_base;$('cleaned-img').src=base+result.enhanced;$('cleaned-wrap').classList.remove('hidden');$('label-cleaned').classList.remove('hidden');$('split').classList.remove('hidden');$('split-range').classList.remove('hidden');setSplit(58);$('original-img').src=result.original_url;$('enhanced-link').innerHTML='<a href="'+base+result.enhanced+'" download>下载 PNG</a>';$('mask-link').innerHTML='<a href="'+base+result.text_mask+'" download>下载 PNG</a>';$('transparent-link').innerHTML='<a href="'+base+result.transparent+'" download>下载 PNG</a>';$('result-label').textContent=`已生成处理版本 · ${result.width}×${result.height}`;$('confidence').textContent='文字保留置信度 '+result.confidence+'%';renderRegions(result.regions,result.width,result.height);setStatus('处理完成。请先查看灰度图，再复核低置信度文字区域。');setStep('review')}catch(e){setStatus(e.message)}});
    $('export').addEventListener('click',()=>{if(!result){setStatus('请先完成一次图片处理。');return}setStep('export');setStatus('结果文件已生成，可从下方下载三种版本。')});
  </script>
</body>
</html>
